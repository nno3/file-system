<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>File system</h1>
    <p class="intro">A C++ program that keeps folders and files in memory. This page runs the same commands. Try <code>load 1</code>, then <code>tree</code>.</p>
    <p class="commands">cd, ls, pwd, tree, touch, mkdir, rm, rmdir, mv, load, exit</p>
    <div class="terminal" id="terminal">
        <pre id="log"></pre>
        <form id="line">
            <label id="prompt" for="command"></label>
            <input id="command" autocomplete="off" spellcheck="false" autofocus>
        </form>
    </div>
</main>
<script src="app.js"></script>
</body>
</html>
